name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: make test
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: Coverage
        run: make coverage
      - name: Package build
        run: make build

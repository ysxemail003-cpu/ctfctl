[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctf-agent"
version = "0.5.0"
description = "Evidence-first agentic CTF runtime for Kali Linux — build and field your own AI CTF experts"
authors = [
    { name = "ctfctl contributors", email = "ysxemail001@163.com" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "ruff>=0.4",
    "mypy>=1.10",
    "build>=1",
]

[project.scripts]
ctfctl = "ctf_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["ctf_agent"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# Batch 3 reached the DoD overall-coverage target (>=80%).
fail_under = 80

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Conservative, high-signal rules for the baseline; expand later.
select = ["E4", "E7", "E9", "F", "W"]

[tool.mypy]
python_version = "3.11"
files = ["src/ctf_agent"]
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_ignores = false
